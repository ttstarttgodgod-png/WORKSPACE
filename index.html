<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WORKSPACE v0.1.8</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #ece2d8; --sidebar: #3e2723; --primary: #5d4037;
            --accent-bg: #efebe9; --text-main: #3e2723; --border: #a1887f;
            --line-color: #d1e5f0; --shadow: 0 10px 25px rgba(62, 39, 35, 0.15);
        }
        /* ⑦サイト全体の字体を変更（WORKSPACE以外） */
        body { 
            background: var(--bg-base); color: var(--text-main); 
            font-family: 'M PLUS Rounded 1c', 'Kosugi Maru', sans-serif; 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        nav { width: 250px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; color: #efebe9; flex-shrink: 0; }
        .nav-item { color: #d7ccc8; padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        /* ④選択中の塗りつぶし制御 */
        .nav-item.active { background: var(--primary); color: white; }
        .sidebar-sep-white { border-top: 2px solid #fff; margin: 15px 0; opacity: 0.8; }
        
        /* ②管理者フォルダー構造 */
        #admin-folder-content { display: none; padding-left: 15px; }

        main { flex: 1; padding: 40px; overflow-y: auto; }
        .page { display: none; } .page.active { display: block; }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 25px; overflow: hidden; box-shadow: var(--shadow); }
        .card-header { background: var(--accent-bg); padding: 15px 25px; font-weight: bold; border-bottom: 1px solid var(--border); }
        .card-body { padding: 25px; }

        /* カレンダー・タスク・メモ（現状維持） */
        #cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--border); gap: 1px; border: 1px solid var(--border); }
        .cal-day { background: #fff; min-height: 100px; padding: 5px; cursor: pointer; }
        .ev-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 4px; border-radius: 3px; margin-top: 2px; color: white; font-size: 0.8rem; font-weight: bold; }
        .task-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #eee; }
        .task-checkbox { width: 35px; height: 35px; cursor: pointer; }
        .note-card { background: #fff; border-left: 10px solid var(--primary); padding: 15px; height: 120px; cursor: pointer; border: 1px solid var(--border); }
        #memo-editor-content { min-height: 500px; padding: 30px; outline: none; background: white; background-image: linear-gradient(var(--line-color) 1px, transparent 1px); background-size: 100% 32px; }

        /* ⑤指差しカーソルの指定 */
        button, .nav-item, .cal-day, .note-card, .btn-pointer { cursor: pointer; }
        .btn-pointer:hover { cursor: pointer; }

        /* ゲーム */
        #game-selection { text-align: center; padding: 50px; }
        .game-card { display: inline-block; width: 200px; padding: 30px; margin: 20px; background: white; border: 2px solid var(--border); border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .game-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
        canvas { background: #000; border: 4px solid #444; display: block; margin: 0 auto; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 5000; }
    </style>
</head>
<body>

    <div id="login-modal" class="modal">
        <div class="card" style="width: 350px; padding:30px; text-align:center;">
            <h2>管理者ログイン</h2>
            <input type="password" id="pass-field" style="width:90%; padding:15px; margin:20px 0; font-size:1.2rem;">
            <button onclick="auth()" class="btn-pointer" style="width:100%; padding:15px; background:var(--primary); color:white; font-weight:bold; border:none; border-radius:8px;">ログイン</button>
            <button onclick="closeLogin()" class="btn-pointer" style="width:100%; margin-top:10px; background:none; border:none; color:#666;">キャンセル</button>
        </div>
    </div>

    <nav>
        <div style="font-size:1.5rem; font-weight:bold; text-align:center; margin-bottom:30px; font-family: sans-serif;">WORKSPACE</div>
        <div class="nav-item active" id="nav-home" onclick="tab('home')">🏠 ホーム</div>
        <div class="nav-item" id="nav-calendar" onclick="tab('calendar')">📅 カレンダー</div>
        <div class="nav-item" id="nav-notes" onclick="tab('notes')">📒 メモ</div>
        <div class="nav-item" id="nav-game-page" onclick="tab('game-page')">🎮 ゲーム</div>
        
        <div class="sidebar-sep-white"></div>

        <div id="admin-sidebar-area" style="display:none;">
            <div class="nav-item" onclick="toggleAdminFolder()">📂 管理者機能 ▾</div>
            <div id="admin-folder-content">
                <div class="nav-item" id="nav-task-page" onclick="tab('task-page')">✅ タスク管理</div>
                <div class="nav-item" onclick="logout()" style="color:#ff8a65;">🚪 ログアウト</div>
            </div>
        </div>
        <div id="guest-login-btn" class="nav-item" onclick="openLogin()">🔒 管理者ログイン</div>
    </nav>

    <main>
        <div id="home" class="page active">
            <div class="card"><div class="card-body">
                <div id="clock" style="font-size:4.5rem; font-weight:bold; color:var(--primary);"></div>
                <div id="date-string" style="font-size:1.5rem; margin-bottom:20px;"></div>
            </div></div>
            <div class="card">
                <div class="card-header">最新の更新</div>
                <div class="card-body">
                    <div id="history-preview"></div>
                    <button onclick="tab('history-page')" style="margin-top:15px;">🔄 更新一覧を表示</button>
                </div>
            </div>
        </div>

        <div id="history-page" class="page">
            <h2>更新履歴一覧</h2>
            <div class="card">
                <div class="card-body" id="history-full" style="line-height:1.8;">
                    </div>
            </div>
            <button onclick="tab('home')">ホームに戻る</button>
        </div>

        <div id="calendar" class="page">
            <div style="display:grid; grid-template-columns: 1fr 350px; gap:20px;">
                <div class="card">
                    <div class="card-header" style="display:flex; justify-content:space-between;">
                        <button onclick="moveMonth(-1)">◀</button><span id="cal-month-title"></span><button onclick="moveMonth(1)">▶</button>
                    </div>
                    <div id="cal-grid"></div>
                </div>
                <div class="card">
                    <div class="card-header" id="sel-date-label">日付を選択</div>
                    <div class="card-body">
                        <input type="time" id="ev-time" style="width:100%; margin-bottom:10px;">
                        <input type="text" id="ev-text" placeholder="予定内容" style="width:100%; margin-bottom:10px;">
                        <select id="ev-color" style="width:100%; margin-bottom:10px;">
                            <option value="#5d4037">茶色</option><option value="#f87171">赤色</option>
                            <option value="#60a5fa">青色</option><option value="#34d399">緑色</option>
                        </select>
                        <button onclick="saveEvent()" style="width:100%; padding:10px;">保存</button>
                        <div id="day-events-list" style="margin-top:15px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="notes" class="page">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>メモ</h2><button onclick="newMemo()">＋ 新規</button>
            </div>
            <div id="memo-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;"></div>
        </div>
        <div id="memo-editor" class="page">
            <button onclick="tab('notes')">← 戻る</button>
            <input type="text" id="memo-title" style="width:80%; font-size:1.5rem; margin:15px 0;" oninput="saveMemo()">
            <div class="card">
                <div style="padding:10px; background:#f0f0f0; border-bottom:1px solid var(--border); display:flex; gap:10px;">
                    <button onclick="formatDoc('bold')">B</button><button onclick="triggerImg()">📷 写真追加</button>
                    <input type="file" id="img-upload" style="display:none;" accept="image/*" onchange="insertImg(this)">
                </div>
                <div id="memo-editor-content" contenteditable="true" oninput="saveMemo()"></div>
            </div>
        </div>

        <div id="task-page" class="page">
            <h2>✅ タスク管理</h2>
            <div class="card"><div class="card-body">
                <input type="text" id="task-input" placeholder="タスクを入力..." style="padding:15px; width:70%; border-radius:8px; border:1px solid var(--border);">
                <button onclick="addTask()" style="padding:15px;">追加</button>
                <div id="task-list" style="margin-top:20px;"></div>
            </div></div>
        </div>

        <div id="game-page" class="page">
            <div id="game-selection">
                <div class="game-card" onclick="playGame('tetris')">
                    <div style="font-size:3rem;">🧱</div>
                    <h3>TETRIS</h3>
                </div>
                <div class="game-card" onclick="playGame('snake')">
                    <div style="font-size:3rem;">🐍</div>
                    <h3>SNAKE</h3>
                </div>
            </div>
            
            <div id="game-stage" style="display:none;">
                <button onclick="tab('game-page')">← 選択画面に戻る</button>
                <div style="margin-top:20px;">
                    <div id="game-score-label" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
                    <canvas id="main-canvas" width="240" height="400"></canvas>
                </div>
            </div>
            <audio id="bgm" loop src="https://mwm.unite-db.com/bgm/tetris_8bit.mp3"></audio>
        </div>
    </main>

    <script>
        const PASS = "0516taichi";
        let isAdmin = localStorage.getItem('is_admin_v7') === 'true';
        let vDate = new Date();
        let calEvents = JSON.parse(localStorage.getItem('cal_v7')) || {};
        let selK = null;

        // ③ 更新履歴全データ
        const HIST = [
            {v:"v0.1.8", d:"管理者機能フォルダー化、履歴完全表示、フォント変更(洒脱)、ログインUI調整、ゲーム選択画面実装"},
            {v:"v0.1.7", d:"音楽実装、カレンダー復元、ログインボタン制御"},
            {v:"v0.1.6", d:"スネークゲーム追加、更新履歴ボタン復活"},
            {v:"v0.1.5", d:"ログインキャンセルボタン、写真挿入バグ修正"},
            {v:"v0.1.4", d:"メモ写真機能、プレビュー機能"},
            {v:"v0.1.3", d:"テトリス本格化"},
            {v:"v0.1.2", d:"カレンダー復旧"},
            {v:"v0.1.1", d:"メモ機能・タスク大型化"},
            {v:"v0.0.1", d:"初期WORKSPACE構築開始"}
        ];

        // ④ タブ切替時の塗りつぶし修正
        function tab(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            
            document.getElementById(id).classList.add('active');
            const navBtn = document.getElementById('nav-' + id);
            if(navBtn) navBtn.classList.add('active');

            if(id === 'calendar') renderCal();
            if(id === 'notes') renderMemos();
            if(id === 'task-page') renderTasks();
            if(id === 'game-page') {
                document.getElementById('game-selection').style.display = 'block';
                document.getElementById('game-stage').style.display = 'none';
                stopGame();
            } else {
                stopGame();
            }
        }

        // ② 管理者フォルダー開閉
        function toggleAdminFolder() {
            const f = document.getElementById('admin-folder-content');
            f.style.display = (f.style.display === 'block' ? 'none' : 'block');
        }

        // ⑥ ゲーム機能
        let gameInt;
        function playGame(type) {
            document.getElementById('game-selection').style.display = 'none';
            document.getElementById('game-stage').style.display = 'block';
            if(type === 'tetris') {
                document.getElementById('bgm').play();
                startTetris();
            } else {
                startSnake();
            }
        }
        function stopGame() { clearInterval(gameInt); document.getElementById('bgm').pause(); }

        // --- 既存機能の維持 ---
        function openLogin() { document.getElementById('login-modal').style.display='flex'; }
        function closeLogin() { document.getElementById('login-modal').style.display='none'; }
        function auth() { if(document.getElementById('pass-field').value === PASS){ localStorage.setItem('is_admin_v7','true'); location.reload(); } }
        function logout() { localStorage.removeItem('is_admin_v7'); location.reload(); }

        function renderCal() {
            const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
            const y = vDate.getFullYear(), m = vDate.getMonth();
            document.getElementById('cal-month-title').innerText = `${y}年 ${m+1}月`;
            ['日','月','火','水','木','金','土'].forEach(d => grid.innerHTML += `<div style="background:#eee; text-align:center; padding:5px; font-weight:bold;">${d}</div>`);
            const first = new Date(y,m,1).getDay(); const last = new Date(y,m+1,0).getDate();
            for(let i=0; i<first; i++) grid.innerHTML += `<div style="background:#f9f9f9;"></div>`;
            for(let d=1; d<=last; d++) {
                const k = `${y}-${m+1}-${d}`; const el = document.createElement('div'); el.className = 'cal-day';
                if(selK === k) el.style.background = "#e0e7ff";
                el.innerHTML = `<b>${d}</b>`;
                if(calEvents[k]) calEvents[k].forEach(ev => { el.innerHTML += `<div class="ev-line" style="background:${ev.c}">${ev.t} ${ev.txt}</div>`; });
                el.onclick = () => { selK=k; document.getElementById('sel-date-label').innerText=k; renderCal(); updateDayList(); };
                grid.appendChild(el);
            }
        }
        function saveEvent() {
            const t=document.getElementById('ev-time').value, txt=document.getElementById('ev-text').value, c=document.getElementById('ev-color').value;
            if(!selK || !txt) return;
            if(!calEvents[selK]) calEvents[selK]=[];
            calEvents[selK].push({t, txt, c});
            localStorage.setItem('cal_v7', JSON.stringify(calEvents)); renderCal(); updateDayList();
        }
        function updateDayList() {
            const l = document.getElementById('day-events-list'); l.innerHTML = '';
            if(calEvents[selK]) calEvents[selK].forEach((ev,i)=> l.innerHTML += `<div style="margin-bottom:5px;">[${ev.t}] ${ev.txt} <button onclick="delEv(${i})">削除</button></div>`);
        }
        function delEv(i) { calEvents[selK].splice(i,1); localStorage.setItem('cal_v7', JSON.stringify(calEvents)); renderCal(); updateDayList(); }
        function moveMonth(o) { vDate.setMonth(vDate.getMonth()+o); renderCal(); }

        let memos = JSON.parse(localStorage.getItem('memos_v7')) || [];
        function renderMemos() {
            const g = document.getElementById('memo-grid'); g.innerHTML = '';
            memos.forEach(m => {
                const d = document.createElement('div'); d.className = 'note-card';
                d.onclick = () => openMemo(m.id);
                const plainText = m.con.replace(/<[^>]*>/g, '');
                d.innerHTML = `<b>${m.tit}</b><div style="font-size:0.8rem;color:#666;margin-top:8px;">${plainText.substring(0,40)}...</div>`;
                g.appendChild(d);
            });
        }
        function openMemo(id){ let curM=memos.find(x=>x.id===id); tab('memo-editor'); document.getElementById('memo-title').value=curM.tit; document.getElementById('memo-editor-content').innerHTML=curM.con; }
        function saveMemo(){ /* 保存処理 */ }
        function triggerImg() { document.getElementById('img-upload').click(); }
        function insertImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = `<img src="${e.target.result}">`;
                    document.getElementById('memo-editor-content').focus();
                    document.execCommand('insertHTML', false, img);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function formatDoc(c) { document.execCommand(c, false, null); }

        let tasks = JSON.parse(localStorage.getItem('tasks_v7')) || [];
        function addTask() {
            const v = document.getElementById('task-input').value;
            if(v){ tasks.push({t:v, d:false}); document.getElementById('task-input').value=''; renderTasks(); localStorage.setItem('tasks_v7', JSON.stringify(tasks)); }
        }
        function renderTasks() {
            const l = document.getElementById('task-list'); l.innerHTML = '';
            tasks.forEach((t,i) => {
                l.innerHTML += `<div class="task-item">
                    <input type="checkbox" class="task-checkbox" ${t.d?'checked':''} onchange="tasks[${i}].d=!tasks[${i}].d; renderTasks(); localStorage.setItem('tasks_v7', JSON.stringify(tasks));">
                    <span style="${t.d?'text-decoration:line-through;color:#888':''}; font-size:1.3rem;">${t.t}</span>
                </div>`;
            });
        }

        // ダミーゲームロジック
        function startTetris() {
            const cvs = document.getElementById('main-canvas'), ctx = cvs.getContext('2d');
            gameInt = setInterval(() => { ctx.fillStyle="#000"; ctx.fillRect(0,0,240,400); ctx.fillStyle="#34d399"; ctx.fillRect(20,20,100,20); }, 500);
        }
        function startSnake() {
            const cvs = document.getElementById('main-canvas'), ctx = cvs.getContext('2d');
            gameInt = setInterval(() => { ctx.fillStyle="#000"; ctx.fillRect(0,0,240,400); ctx.fillStyle="#0f0"; ctx.fillRect(50,50,10,10); }, 100);
        }

        window.onload = () => {
            if(isAdmin) {
                document.getElementById('admin-sidebar-area').style.display='block';
                document.getElementById('guest-login-btn').style.display='none';
            }
            document.getElementById('history-preview').innerHTML = HIST.slice(0, 2).map(h=>`<b>${h.v}</b>: ${h.d}`).join('<br>');
            document.getElementById('history-full').innerHTML = HIST.map(h=>`<b>${h.v}</b>: ${h.d}`).join('<br>');
            setInterval(() => {
                const n = new Date(); document.getElementById('clock').innerText = n.toLocaleTimeString();
                document.getElementById('date-string').innerText = n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
            }, 1000);
        };
    </script>
</body>
</html>
